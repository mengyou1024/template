services:
  # PostgreSQL database
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: {{project-name}}
      TZ: Asia/Shanghai
    # 显式指定服务器时区，覆盖旧数据卷初始化时写入 postgresql.conf 的 UTC 配置
    command: [ "postgres", "-c", "timezone=Asia/Shanghai", "-c", "log_timezone=Asia/Shanghai" ]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dev container (used by VS Code Dev Containers)
  # Database runs on host Docker — start it with: docker compose up -d db
  # Connects via host.docker.internal to reach the host-mapped port
  dev:
    image: rust:1-trixie
    environment:
      APP_DATABASE_URL: postgres://postgres:postgres@host.docker.internal:5432/{{project-name}}
      RUST_LOG: debug
      TZ: Asia/Shanghai
    volumes:
      - .:/workspace:cached
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-cache:/workspace/target
    command: sleep infinity
    working_dir: /workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Database migration runner
  migration:
    build:
      context: .
      target: migration
    environment:
      APP_DATABASE_URL: postgres://postgres:postgres@db:5432/{{project-name}}
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # Application server
  app:
    build:
      context: .
      target: runtime
    environment:
      APP_DATABASE_URL: postgres://postgres:postgres@db:5432/{{project-name}}
      APP_SERVER_HOST: 0.0.0.0
      APP_SERVER_PORT: 3000
      RUST_LOG: info
      TZ: Asia/Shanghai
    ports:
      - "3000:3000"
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  cargo-registry:
  cargo-git:
  target-cache:

networks:
  app-network:
    driver: bridge
