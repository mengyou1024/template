[workspace]
resolver = "3"
members = ["{{ project-name }}-web"]
default-members = ["{{ project-name }}-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
gpui-kit = { version = "0.9", features = ["component", "assets"] }
rust-i18n = "4.2"
# debug-embed: 让 debug 构建也内嵌资源. 浏览器没有文件系统,
# 否则 debug 的 wasm 构建会在运行时尝试从磁盘读取图标而失败.
# include-exclude: `#[include]` 属性所需. wasm 构建下 gpui-kit 不会再启用该 feature,
# 因此必须由本项目显式声明.
rust-embed = { version = "8.13", features = ["debug-embed", "include-exclude"] }
anyhow = "1.0"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
