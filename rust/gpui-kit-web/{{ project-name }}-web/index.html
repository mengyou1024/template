<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ project-name }}</title>
    <!-- Trunk 会编译 wasm、运行 wasm-bindgen 并注入加载脚本. -->
    <!-- data-wasm-opt="0": 关闭 wasm-opt(默认只在 release 生效), 避免额外下载与超长优化. -->
    <link
      data-trunk
      rel="rust"
      href="Cargo.toml"
      data-target-name="app_web"
      data-wasm-opt="0"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        background: #ffffff;
        color: #1f2023;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", sans-serif;
      }

      body > canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      #loading {
        position: fixed;
        z-index: 1;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
      }

      .spinner {
        border: 4px solid rgba(31, 32, 35, 0.1);
        border-left-color: #1f2023;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .error {
        color: #d32f2f;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <p>Loading {{ project-name }}...</p>
    </div>
    <script>
      // Trunk 初始化 wasm 之后会把 Rust 导出的函数挂到 window.wasmBindings,
      // 这里等待它就绪, 再调用 run() 启动窗口.
      (function boot() {
        const bindings = window.wasmBindings;
        if (!bindings || typeof bindings.run !== "function") {
          setTimeout(boot, 50);
          return;
        }

        const loading = document.getElementById("loading");
        Promise.resolve(bindings.run())
          .then(() => loading?.remove())
          .catch((error) => {
            console.error("Failed to initialize:", error);
            if (loading) {
              loading.innerHTML =
                '<div class="error"><h2>Failed to load the application</h2><p>' +
                (error?.message ?? error) +
                "</p><p>Please check the console for more details.</p></div>";
            }
          });
      })();
    </script>
  </body>
</html>
