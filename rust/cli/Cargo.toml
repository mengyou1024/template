[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
description = "A CLI application built with clap"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "local-time",
] }
time = { version = "0.3", features = ["macros"] }
