# Android Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true

# ---------------------------------------------------------------------------
# Release signing (可选)
# ---------------------------------------------------------------------------
# 把 keystore 文件放在 android/app/ 下, 或用绝对路径; 留空则 release 会
# fallback 到 debug 签名, APK 仍可直接 adb install.
#
# Windows PowerShell 设置临时环境变量示例:
#   $env:ANDROID_KEYSTORE = "D:\path\to\release.jks"
#   $env:ANDROID_KEY_ALIAS = "my-key"
#   $env:ANDROID_KEY_PASSWORD = "secret"
#   $env:ANDROID_STORE_PASSWORD = "secret"
#
# Linux / macOS:
#   export ANDROID_KEYSTORE="$HOME/release.jks"
#   export ANDROID_KEY_ALIAS="my-key"
#   export ANDROID_KEY_PASSWORD="secret"
#   export ANDROID_STORE_PASSWORD="secret"
#
# 首次生成 keystore:
#   keytool -genkeypair -v -keystore release.jks -alias my-key \
#       -keyalg RSA -keysize 2048 -validity 10000
# ---------------------------------------------------------------------------

#ANDROID_KEYSTORE=
#ANDROID_KEY_ALIAS=
#ANDROID_KEY_PASSWORD=
#ANDROID_STORE_PASSWORD=
