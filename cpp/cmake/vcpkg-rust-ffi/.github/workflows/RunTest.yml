name: 运行测试

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test_windows:
    strategy:
      matrix:
        include:
          # MD运行时+动态库 / MD运行时+静态库 / MT运行时+静态库
          - preset: msvc-x64-md-dynamic-dbg
            arch: x64
          - preset: msvc-x64-md-static-dbg
            arch: x64
          - preset: msvc-x64-mt-static-dbg
            arch: x64
    runs-on: windows-latest
    steps:
      # 拉取仓库
      - uses: actions/checkout@v4
      # 配置MSVC环境
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      # 编译运行测试
      - name: Build and Test
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build build/${{ matrix.preset }}
          cd build/${{ matrix.preset }}
          ctest -C Debug -VV
